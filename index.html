<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DevOps Roadmap — Progress Tracker</title>
<style>
  :root {
    --bg: #0b0f14;
    --surface: #10161d;
    --surface-2: #151d26;
    --border: #1e2933;
    --border-soft: #18212b;
    --text: #d8dee5;
    --text-dim: #8a95a1;
    --text-faint: #5c6672;
    --accent: #3fb950;
    --accent-dim: #2ea043;
    --accent-glow: rgba(63, 185, 80, 0.12);
    --note: #d29922;
    --note-dim: rgba(210, 153, 34, 0.1);
    --danger: #f85149;
    --clip: #58a6ff;
    --clip-dim: rgba(88, 166, 255, 0.1);
    --mono: "JetBrains Mono", "Fira Code", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    font-size: 14px;
    line-height: 1.6;
    min-height: 100vh;
  }

  .shell { max-width: 860px; margin: 0 auto; padding: 0 20px 120px; }

  header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(11, 15, 20, 0.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    padding: 18px 0 16px;
  }

  .header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }

  .brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
  }

  .brand .prompt { color: var(--accent); font-weight: 700; }

  .brand h1 {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--text);
  }

  .brand .cursor {
    display: inline-block;
    width: 8px;
    height: 15px;
    background: var(--accent);
    animation: blink 1.1s steps(1) infinite;
    transform: translateY(2px);
  }

  @keyframes blink { 50% { opacity: 0; } }

  .toolbar { display: flex; gap: 8px; }

  .btn {
    font-family: var(--mono);
    font-size: 11.5px;
    padding: 6px 12px;
    background: var(--surface-2);
    color: var(--text-dim);
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s, transform 0.05s;
    letter-spacing: 0.03em;
  }

  .btn:hover { color: var(--text); border-color: #2c3a47; }
  .btn:active { transform: translateY(1px); }
  .btn.danger:hover { color: var(--danger); border-color: rgba(248, 81, 73, 0.4); }

  .progress-wrap { margin-top: 14px; }

  .progress-meta {
    display: flex;
    justify-content: space-between;
    font-size: 11.5px;
    color: var(--text-dim);
    margin-bottom: 6px;
  }

  .progress-meta .pct { color: var(--accent); font-weight: 700; }

  .bar {
    height: 6px;
    background: var(--surface-2);
    border-radius: 3px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    width: 0%;
    background: var(--accent);
    border-radius: 3px;
    transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .legend {
    display: flex;
    gap: 18px;
    font-size: 11px;
    color: var(--text-faint);
    margin-top: 10px;
    flex-wrap: wrap;
  }

  .legend span::before {
    content: "";
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 2px;
    margin-right: 6px;
    transform: translateY(0.5px);
  }
  .legend .l-done::before { background: var(--accent); }
  .legend .l-note::before { background: var(--note); }
  .legend .l-clip::before { background: var(--clip); }
  .legend .l-hint::before { display: none; }

  main { padding-top: 34px; }

  section { margin-bottom: 36px; }

  .sec-head {
    display: flex;
    align-items: baseline;
    gap: 12px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 8px;
    margin-bottom: 4px;
  }

  .sec-num {
    font-size: 12px;
    color: var(--accent);
    font-weight: 700;
    letter-spacing: 0.05em;
  }

  .sec-title {
    font-size: 14.5px;
    font-weight: 700;
    letter-spacing: 0.02em;
  }

  .sec-count {
    margin-left: auto;
    font-size: 11px;
    color: var(--text-faint);
    white-space: nowrap;
  }

  .sec-count.complete { color: var(--accent); }

  .topic { border-bottom: 1px solid var(--border-soft); }

  .topic.dragover {
    outline: 1px dashed var(--accent);
    outline-offset: -2px;
    background: var(--accent-glow);
  }

  .topic-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 9px 4px;
    cursor: pointer;
    user-select: none;
  }

  .topic-row:hover .topic-name { color: #fff; }

  .topic-row input[type="checkbox"] {
    appearance: none;
    width: 16px; height: 16px;
    border: 1.5px solid #33404d;
    border-radius: 4px;
    cursor: pointer;
    flex-shrink: 0;
    position: relative;
    transition: background 0.15s, border-color 0.15s;
  }

  .topic-row input[type="checkbox"]:checked {
    background: var(--accent);
    border-color: var(--accent);
  }

  .topic-row input[type="checkbox"]:checked::after {
    content: "";
    position: absolute;
    left: 4.5px; top: 1.5px;
    width: 4px; height: 8px;
    border: solid #0b0f14;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }

  .topic-row input[type="checkbox"]:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .topic-name {
    flex: 1;
    transition: color 0.15s;
  }

  .topic.done .topic-name {
    color: var(--text-faint);
    text-decoration: line-through;
    text-decoration-color: rgba(63, 185, 80, 0.5);
  }

  .note-toggle {
    font-family: var(--mono);
    font-size: 10.5px;
    padding: 2px 8px;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 4px;
    color: var(--text-faint);
    cursor: pointer;
    flex-shrink: 0;
    transition: color 0.15s, border-color 0.15s;
  }

  .note-toggle:hover { color: var(--note); border-color: rgba(210, 153, 34, 0.35); }
  .note-toggle.has-note { color: var(--note); }

  .note-toggle.clip-btn:hover { color: var(--clip); border-color: rgba(88, 166, 255, 0.35); }
  .note-toggle.clip-btn.has-files { color: var(--clip); }

  .note-area {
    display: none;
    padding: 0 4px 10px 32px;
  }

  .note-area.open { display: block; }

  .note-area textarea {
    width: 100%;
    min-height: 54px;
    background: var(--note-dim);
    border: 1px solid rgba(210, 153, 34, 0.25);
    border-radius: 6px;
    color: #e3b341;
    font-family: var(--mono);
    font-size: 12.5px;
    padding: 8px 10px;
    resize: vertical;
    outline: none;
  }

  .note-area textarea:focus { border-color: rgba(210, 153, 34, 0.6); }
  .note-area textarea::placeholder { color: rgba(210, 153, 34, 0.4); }

  .note-hint {
    display: none;
    font-size: 10.5px;
    color: var(--text-faint);
    margin-top: 4px;
  }

  .note-area.open .note-hint { display: block; }

  .att-area {
    display: none;
    padding: 0 4px 10px 32px;
    flex-wrap: wrap;
    gap: 8px;
  }

  .att-area.has-files { display: flex; }

  .att-chip {
    position: relative;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface-2);
    overflow: hidden;
    cursor: pointer;
    transition: border-color 0.15s;
  }

  .att-chip:hover { border-color: #2c3a47; }

  .att-chip img.att-thumb {
    width: 64px;
    height: 64px;
    object-fit: cover;
    display: block;
  }

  .att-chip .att-file {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    font-size: 11.5px;
    color: var(--text-dim);
    max-width: 260px;
  }

  .att-chip .att-file .att-icon { color: var(--clip); flex-shrink: 0; }

  .att-chip .att-file .att-name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .att-chip .att-file .att-size {
    color: var(--text-faint);
    font-size: 10.5px;
    flex-shrink: 0;
  }

  .att-x {
    position: absolute;
    top: 3px; right: 3px;
    width: 16px; height: 16px;
    border-radius: 4px;
    background: rgba(11, 15, 20, 0.85);
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: 11px;
    line-height: 15px;
    text-align: center;
    cursor: pointer;
    border: none;
    padding: 0;
  }

  .att-x:hover { color: var(--danger); }

  .sec-complete-badge {
    display: none;
    font-size: 10.5px;
    color: var(--accent);
  }
  section.complete .sec-complete-badge { display: inline; }

  footer {
    margin-top: 50px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--text-faint);
    display: flex;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  #toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 12.5px;
    padding: 10px 18px;
    border-radius: 8px;
    opacity: 0;
    transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s;
    z-index: 100;
    max-width: 90vw;
  }

  #toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }

  @media (max-width: 560px) {
    .brand h1 { font-size: 14px; }
    .toolbar { width: 100%; }
    .note-area { padding-left: 4px; }
    .att-area { padding-left: 4px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .bar-fill { transition: none; }
    .brand .cursor { animation: none; }
    #toast { transition: none; }
    html { scroll-behavior: auto; }
  }
</style>
</head>
<body>

<header>
  <div class="shell">
    <div class="header-row">
      <div class="brand">
        <span class="prompt">intern@devops</span>
        <h1>:~/$ roadmap --track</h1>
        <span class="cursor"></span>
      </div>
      <div class="toolbar">
        <button class="btn" id="exportBtn">export</button>
        <button class="btn" id="importBtn">import</button>
        <button class="btn danger" id="resetBtn">reset</button>
        <input type="file" id="importFile" accept=".json" hidden>
      </div>
    </div>
    <div class="progress-wrap">
      <div class="progress-meta">
        <span id="progressLabel">0 / 0 topics</span>
        <span class="pct" id="progressPct">0%</span>
      </div>
      <div class="bar"><div class="bar-fill" id="barFill"></div></div>
    </div>
    <div class="legend">
      <span class="l-done">done</span>
      <span class="l-note">has note</span>
      <span class="l-clip">has file</span>
      <span class="l-hint">ticks/notes in localStorage · files in IndexedDB · export to move devices</span>
    </div>
  </div>
</header>

<main class="shell" id="roadmap"></main>

<footer class="shell">
  <span>source: roadmap.sh/devops</span>
  <span id="lastSaved"></span>
</footer>

<div id="toast" role="status"></div>

<script>
const ROADMAP = [
  { id: "lang", title: "Learn a Programming Language", topics: ["Python", "Ruby", "Go", "Rust", "JavaScript / Node.js"] },
  { id: "script", title: "Scripting", topics: ["Bash", "PowerShell"] },
  { id: "os", title: "Operating Systems & Terminal", topics: ["Linux — Ubuntu / Debian", "Linux — SUSE", "Linux — RHEL / Derivatives", "Unix — FreeBSD / OpenBSD / NetBSD", "Windows", "Process Monitoring", "Performance Monitoring", "Networking Tools", "Text Manipulation", "Vim / Nano / Emacs"] },
  { id: "vcs", title: "Version Control & Hosting", topics: ["Git", "GitHub", "GitLab", "Bitbucket"] },
  { id: "net", title: "Networking & Protocols", topics: ["DNS", "HTTP / HTTPS", "SSL / TLS", "SSH", "FTP / SFTP", "OSI Model", "White / Grey Listing", "Email — SMTP", "Email — DMARC", "Email — SPF", "Email — IMAP", "Email — POP3S", "Email — Domain Keys"] },
  { id: "web", title: "Web Servers, Proxies & Load Balancers", topics: ["Nginx", "Apache", "Caddy", "Tomcat", "IIS", "Forward Proxy", "Reverse Proxy", "Caching Server", "Firewall", "Load Balancer"] },
  { id: "cloud", title: "Cloud Providers", topics: ["AWS", "Azure", "Google Cloud", "DigitalOcean", "Alibaba Cloud", "Hetzner", "Contabo", "Heroku"] },
  { id: "serverless", title: "Serverless", topics: ["AWS Lambda", "Cloudflare Workers", "Azure Functions", "GCP Functions", "Vercel", "Netlify"] },
  { id: "containers", title: "Containers", topics: ["Docker", "LXC"] },
  { id: "orchestration", title: "Container Orchestration", topics: ["Kubernetes", "GKE / EKS / AKS", "AWS ECS / Fargate", "Docker Swarm"] },
  { id: "cicd", title: "CI / CD", topics: ["Jenkins", "GitLab CI", "GitHub Actions", "Circle CI", "TeamCity", "Octopus Deploy"] },
  { id: "config", title: "Configuration Management", topics: ["Ansible", "Chef", "Puppet"] },
  { id: "provision", title: "Provisioning / Infrastructure as Code", topics: ["Terraform", "Pulumi", "AWS CloudFormation", "AWS CDK"] },
  { id: "infra-mon", title: "Infrastructure Monitoring", topics: ["Prometheus", "Grafana", "Zabbix", "Datadog"] },
  { id: "app-mon", title: "Application Monitoring", topics: ["Jaeger", "New Relic", "Datadog", "OpenTelemetry"] },
  { id: "logs", title: "Log Management", topics: ["Elastic Stack", "Loki", "Splunk", "Graylog", "Papertrail"] },
  { id: "secrets", title: "Secret Management", topics: ["HashiCorp Vault", "Sealed Secrets", "SOPS"] },
  { id: "artifacts", title: "Artifact Management", topics: ["JFrog Artifactory", "Sonatype Nexus", "Cloudsmith"] },
  { id: "gitops", title: "GitOps", topics: ["ArgoCD", "FluxCD", "Cloud-Specific GitOps Tools"] },
  { id: "mesh", title: "Service Mesh", topics: ["Istio", "Consul", "Linkerd", "Envoy"] },
  { id: "patterns", title: "Cloud Design Patterns", topics: ["Availability", "Data Management", "Design & Implementation", "Management & Monitoring"] }
];

const STORAGE_KEY = "devops-roadmap-progress-v1";
const MAX_FILE_MB = 25;
let state = { done: {}, notes: {}, attachments: {} };
let fileCache = {};
let filesOK = true;

function key(secId, idx) { return secId + "/" + idx; }

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && typeof parsed === "object") {
        state.done = parsed.done || {};
        state.notes = parsed.notes || {};
        state.attachments = parsed.attachments || {};
      }
    }
  } catch (e) { state = { done: {}, notes: {}, attachments: {} }; }
}

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  updateLastSaved();
}

function updateLastSaved() {
  const el = document.getElementById("lastSaved");
  const d = new Date();
  const t = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  el.textContent = "saved " + t;
}

function genId() {
  return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);
}

function fmtSize(bytes) {
  if (bytes < 1024) return bytes + " B";
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + " KB";
  return (bytes / 1048576).toFixed(1) + " MB";
}

function openDB() {
  return new Promise((res, rej) => {
    if (!window.indexedDB) { rej(new Error("no idb")); return; }
    const r = indexedDB.open("devops-roadmap", 1);
    r.onupgradeneeded = () => {
      if (!r.result.objectStoreNames.contains("files")) {
        r.result.createObjectStore("files", { keyPath: "id" });
      }
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}

function idbRun(fn) {
  return openDB().then(db => new Promise((res, rej) => {
    const tx = db.transaction("files", "readwrite");
    const store = tx.objectStore("files");
    const out = fn(store);
    tx.oncomplete = () => { db.close(); res(out && out.result !== undefined ? out.result : out); };
    tx.onerror = () => { db.close(); rej(tx.error); };
  }));
}

async function initFiles() {
  try {
    const records = await idbRun(store => store.getAll());
    records.forEach(rec => {
      fileCache[rec.id] = { name: rec.name, type: rec.type, size: rec.size, blob: rec.blob, url: URL.createObjectURL(rec.blob) };
    });
    for (const k of Object.keys(state.attachments)) {
      state.attachments[k] = state.attachments[k].filter(id => fileCache[id]);
      if (!state.attachments[k].length) delete state.attachments[k];
    }
    save();
  } catch (e) { filesOK = false; }
}

function addFiles(fileList, k) {
  const files = Array.from(fileList || []);
  if (!files.length) return;
  if (!filesOK) { toast("file storage unavailable in this browser"); return; }
  let added = 0, skipped = 0;
  const work = files.map(file => {
    if (file.size > MAX_FILE_MB * 1048576) { skipped++; return Promise.resolve(); }
    const id = genId();
    const rec = { id, topicKey: k, name: file.name || "pasted-file", type: file.type || "application/octet-stream", size: file.size, blob: file, addedAt: Date.now() };
    return idbRun(store => store.put(rec)).then(() => {
      fileCache[id] = { name: rec.name, type: rec.type, size: rec.size, blob: rec.blob, url: URL.createObjectURL(rec.blob) };
      if (!state.attachments[k]) state.attachments[k] = [];
      state.attachments[k].push(id);
      added++;
    }).catch(() => { skipped++; });
  });
  Promise.all(work).then(() => {
    save();
    renderTopicExtras(k);
    if (added) toast(added + " file" + (added > 1 ? "s" : "") + " attached");
    if (skipped) toast(skipped + " skipped (over " + MAX_FILE_MB + " MB or storage error)");
  });
}

function deleteFile(id, k) {
  const list = state.attachments[k] || [];
  const i = list.indexOf(id);
  if (i > -1) list.splice(i, 1);
  if (!list.length) delete state.attachments[k];
  if (fileCache[id]) { URL.revokeObjectURL(fileCache[id].url); delete fileCache[id]; }
  idbRun(store => store.delete(id)).catch(() => {});
  save();
  renderTopicExtras(k);
}

function blobToB64(blob) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(",")[1] || "");
    r.onerror = () => rej(r.error);
    r.readAsDataURL(blob);
  });
}

function b64ToBlob(b64, type) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new Blob([bytes], { type: type || "application/octet-stream" });
}

function totalTopics() {
  return ROADMAP.reduce((n, s) => n + s.topics.length, 0);
}

function doneCount() {
  return Object.values(state.done).filter(Boolean).length;
}

function updateProgress() {
  const total = totalTopics();
  const done = doneCount();
  const pct = total ? Math.round((done / total) * 100) : 0;
  document.getElementById("progressLabel").textContent = done + " / " + total + " topics";
  document.getElementById("progressPct").textContent = pct + "%";
  document.getElementById("barFill").style.width = pct + "%";
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function attAreaId(k) { return "att-" + k.replace("/", "-"); }

function renderTopicExtras(k) {
  const area = document.getElementById(attAreaId(k));
  if (!area) return;
  const ids = state.attachments[k] || [];
  area.innerHTML = "";
  ids.forEach(id => {
    const meta = fileCache[id];
    if (!meta) return;
    const chip = document.createElement("div");
    chip.className = "att-chip";
    chip.title = meta.name + " (" + fmtSize(meta.size) + ") — click to open";

    if (meta.type && meta.type.startsWith("image/")) {
      const img = document.createElement("img");
      img.className = "att-thumb";
      img.src = meta.url;
      img.alt = meta.name;
      chip.appendChild(img);
    } else {
      const inner = document.createElement("div");
      inner.className = "att-file";
      const icon = document.createElement("span");
      icon.className = "att-icon";
      icon.textContent = meta.type === "application/pdf" ? "[pdf]" : "[file]";
      const name = document.createElement("span");
      name.className = "att-name";
      name.textContent = meta.name;
      const size = document.createElement("span");
      size.className = "att-size";
      size.textContent = fmtSize(meta.size);
      inner.appendChild(icon);
      inner.appendChild(name);
      inner.appendChild(size);
      chip.appendChild(inner);
    }

    const x = document.createElement("button");
    x.className = "att-x";
    x.type = "button";
    x.textContent = "×";
    x.title = "remove file";
    x.addEventListener("click", e => { e.stopPropagation(); deleteFile(id, k); });
    chip.appendChild(x);

    chip.addEventListener("click", () => window.open(meta.url, "_blank"));
    area.appendChild(chip);
  });
  area.classList.toggle("has-files", ids.length > 0);

  const topicEl = area.closest(".topic");
  if (topicEl) {
    const clipBtn = topicEl.querySelector(".clip-btn");
    if (clipBtn) {
      clipBtn.classList.toggle("has-files", ids.length > 0);
      clipBtn.textContent = ids.length ? "clip ×" + ids.length : "clip +";
    }
  }
}

function updateSectionCount(sectionEl, sec) {
  const doneInSec = sec.topics.reduce((n, _, i) => n + (state.done[key(sec.id, i)] ? 1 : 0), 0);
  const countEl = sectionEl.querySelector(".sec-count");
  const allDone = doneInSec === sec.topics.length;
  countEl.textContent = doneInSec + " / " + sec.topics.length;
  countEl.classList.toggle("complete", allDone);
  sectionEl.classList.toggle("complete", allDone);
}

function render() {
  const root = document.getElementById("roadmap");
  const frag = document.createDocumentFragment();

  ROADMAP.forEach((sec, si) => {
    const section = document.createElement("section");
    section.id = "sec-" + sec.id;

    const doneInSec = sec.topics.reduce((n, _, i) => n + (state.done[key(sec.id, i)] ? 1 : 0), 0);
    const allDone = doneInSec === sec.topics.length;

    const head = document.createElement("div");
    head.className = "sec-head";
    head.innerHTML =
      '<span class="sec-num">' + String(si + 1).padStart(2, "0") + "</span>" +
      '<span class="sec-title">' + esc(sec.title) + "</span>" +
      '<span class="sec-complete-badge">[complete]</span>' +
      '<span class="sec-count' + (allDone ? " complete" : "") + '">' + doneInSec + " / " + sec.topics.length + "</span>";
    section.appendChild(head);

    sec.topics.forEach((name, i) => {
      const k = key(sec.id, i);
      const note = state.notes[k] || "";
      const isDone = !!state.done[k];

      const topic = document.createElement("div");
      topic.className = "topic" + (isDone ? " done" : "");

      const row = document.createElement("label");
      row.className = "topic-row";

      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = isDone;
      cb.addEventListener("change", () => {
        if (cb.checked) state.done[k] = true;
        else delete state.done[k];
        save();
        topic.classList.toggle("done", cb.checked);
        updateSectionCount(section, sec);
        updateProgress();
      });

      const label = document.createElement("span");
      label.className = "topic-name";
      label.textContent = name;

      const noteBtn = document.createElement("button");
      noteBtn.type = "button";
      noteBtn.className = "note-toggle" + (note ? " has-note" : "");
      noteBtn.textContent = note ? "note •" : "note +";
      noteBtn.addEventListener("click", e => {
        e.preventDefault();
        area.classList.toggle("open");
        if (area.classList.contains("open")) ta.focus();
      });

      const clipBtn = document.createElement("button");
      clipBtn.type = "button";
      clipBtn.className = "note-toggle clip-btn";
      clipBtn.textContent = "clip +";
      clipBtn.title = "attach files";
      clipBtn.addEventListener("click", e => {
        e.preventDefault();
        const picker = document.createElement("input");
        picker.type = "file";
        picker.multiple = true;
        picker.addEventListener("change", () => { addFiles(picker.files, k); });
        picker.click();
      });

      row.appendChild(cb);
      row.appendChild(label);
      row.appendChild(noteBtn);
      row.appendChild(clipBtn);

      const area = document.createElement("div");
      area.className = "note-area" + (note ? " open" : "");
      const ta = document.createElement("textarea");
      ta.placeholder = "notes… (what you learned, links, what to revisit)";
      ta.value = note;
      ta.addEventListener("input", () => {
        const v = ta.value.trim();
        if (v) {
          state.notes[k] = ta.value;
          noteBtn.classList.add("has-note");
          noteBtn.textContent = "note •";
        } else {
          delete state.notes[k];
          noteBtn.classList.remove("has-note");
          noteBtn.textContent = "note +";
        }
        save();
      });
      ta.addEventListener("paste", e => {
        if (e.clipboardData && e.clipboardData.files && e.clipboardData.files.length) {
          e.preventDefault();
          addFiles(e.clipboardData.files, k);
        }
      });

      const hint = document.createElement("div");
      hint.className = "note-hint";
      hint.textContent = "paste screenshots with ctrl+v · drag & drop files onto this row";

      area.appendChild(ta);
      area.appendChild(hint);

      const attArea = document.createElement("div");
      attArea.className = "att-area";
      attArea.id = attAreaId(k);

      topic.appendChild(row);
      topic.appendChild(area);
      topic.appendChild(attArea);

      ["dragenter", "dragover"].forEach(ev => {
        topic.addEventListener(ev, e => { e.preventDefault(); topic.classList.add("dragover"); });
      });
      ["dragleave", "drop"].forEach(ev => {
        topic.addEventListener(ev, e => { e.preventDefault(); topic.classList.remove("dragover"); });
      });
      topic.addEventListener("drop", e => {
        if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) {
          addFiles(e.dataTransfer.files, k);
        }
      });

      section.appendChild(topic);
    });

    frag.appendChild(section);
  });

  root.innerHTML = "";
  root.appendChild(frag);
  Object.keys(state.attachments).forEach(k => renderTopicExtras(k));
  updateProgress();
}

let toastTimer;
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
}

document.getElementById("exportBtn").addEventListener("click", async () => {
  try {
    toast("packing export…");
    const attachmentsOut = {};
    for (const k of Object.keys(state.attachments)) {
      const list = [];
      for (const id of state.attachments[k]) {
        const meta = fileCache[id];
        if (!meta) continue;
        list.push({ id, name: meta.name, type: meta.type, size: meta.size, data: await blobToB64(meta.blob) });
      }
      if (list.length) attachmentsOut[k] = list;
    }
    const payload = { done: state.done, notes: state.notes, attachments: attachmentsOut };
    const blob = new Blob([JSON.stringify(payload)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "devops-progress-" + new Date().toISOString().slice(0, 10) + ".json";
    a.click();
    URL.revokeObjectURL(a.href);
    toast("exported (files included)");
  } catch (e) {
    toast("export failed");
  }
});

document.getElementById("importBtn").addEventListener("click", () => {
  document.getElementById("importFile").click();
});

document.getElementById("importFile").addEventListener("change", e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    try {
      const data = JSON.parse(reader.result);
      if (!data || typeof data !== "object" || (!data.done && !data.notes && !data.attachments)) {
        toast("invalid file");
        return;
      }
      state.done = Object.assign({}, state.done, data.done || {});
      state.notes = Object.assign({}, state.notes, data.notes || {});
      if (!state.attachments) state.attachments = {};
      const incoming = data.attachments || {};
      for (const k of Object.keys(incoming)) {
        if (!Array.isArray(incoming[k])) continue;
        for (const item of incoming[k]) {
          if (!item || !item.data) continue;
          const id = item.id || genId();
          if (fileCache[id]) continue;
          let blob;
          try { blob = b64ToBlob(item.data, item.type); } catch (err) { continue; }
          const rec = { id, topicKey: k, name: item.name || "file", type: item.type || "application/octet-stream", size: blob.size, blob, addedAt: Date.now() };
          try { await idbRun(store => store.put(rec)); } catch (err) { continue; }
          fileCache[id] = { name: rec.name, type: rec.type, size: rec.size, blob, url: URL.createObjectURL(blob) };
          if (!state.attachments[k]) state.attachments[k] = [];
          state.attachments[k].push(id);
        }
      }
      save();
      render();
      toast("progress imported");
    } catch (err) {
      toast("could not read that file");
    }
  };
  reader.readAsText(file);
  e.target.value = "";
});

let resetArmed = false, resetTimer;
const resetBtn = document.getElementById("resetBtn");
resetBtn.addEventListener("click", () => {
  if (!resetArmed) {
    resetArmed = true;
    resetBtn.textContent = "sure?";
    resetTimer = setTimeout(() => {
      resetArmed = false;
      resetBtn.textContent = "reset";
    }, 3000);
    return;
  }
  clearTimeout(resetTimer);
  resetArmed = false;
  resetBtn.textContent = "reset";
  Object.values(fileCache).forEach(m => URL.revokeObjectURL(m.url));
  fileCache = {};
  state = { done: {}, notes: {}, attachments: {} };
  if (filesOK) idbRun(store => store.clear()).catch(() => {});
  save();
  render();
  toast("all progress cleared");
});

load();
initFiles().then(render).catch(render);
updateLastSaved();
</script>
</body>
</html>
